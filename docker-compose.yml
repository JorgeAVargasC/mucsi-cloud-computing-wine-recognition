name: wine-recognition

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "22181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./Kafka/kafka-storage/zookeeper/data:/var/lib/zookeeper/data
      - ./Kafka/kafka-storage/zookeeper/log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: EXTERNAL_SAME_HOST://:29092,EXTERNAL_DIFFERENT_HOST://:29093,INTERNAL://:9092
      # 127.0.0.1 instead of localhost: on Windows localhost resolves to IPv6 first and times out
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL_SAME_HOST://127.0.0.1:29092,EXTERNAL_DIFFERENT_HOST://127.0.0.1:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL_SAME_HOST:PLAINTEXT,EXTERNAL_DIFFERENT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - ./Kafka/kafka-storage/kafka/data:/var/lib/kafka/data
      - ./Kafka/kafka-storage/kafka/secrets:/etc/kafka/secrets
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092

  rest:
    build:
      context: .
      dockerfile: rest_service/Dockerfile
    image: wine-rest:1.0.0
    container_name: wine-rest
    ports:
      - "8000:8000"
    environment:
      REST_PORT: 8000
      MODEL_PATH: /models/wine-model.joblib
    volumes:
      - ./model:/models:ro

  grpc:
    build:
      context: .
      dockerfile: grpc_service/Dockerfile
    image: wine-grpc:1.0.0
    container_name: wine-grpc
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: 50051
      MODEL_PATH: /models/wine-model.joblib
    volumes:
      - ./model:/models:ro

  kafka-worker:
    build:
      context: .
      dockerfile: kafka_service/Dockerfile
    image: wine-kafka-worker:1.0.0
    container_name: wine-kafka-worker
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REQUESTS_TOPIC: wine-requests
      PREDICTIONS_TOPIC: wine-predictions
      CONSUMER_GROUP: wine-predictor
      MODEL_PATH: /models/wine-model.joblib
    volumes:
      - ./model:/models:ro
