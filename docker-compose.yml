name: wine-recognition

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "${ZOOKEEPER_HOST_PORT}:${ZOOKEEPER_PORT}"
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./Kafka/kafka-storage/zookeeper/data:/var/lib/zookeeper/data
      - ./Kafka/kafka-storage/zookeeper/log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_SAME_HOST_PORT}:${KAFKA_SAME_HOST_PORT}"
      - "${KAFKA_OTHER_HOST_PORT}:${KAFKA_OTHER_HOST_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_LISTENERS: EXTERNAL_SAME_HOST://:${KAFKA_SAME_HOST_PORT},EXTERNAL_DIFFERENT_HOST://:${KAFKA_OTHER_HOST_PORT},INTERNAL://:${KAFKA_PORT}
      # 127.0.0.1 instead of localhost: on Windows localhost resolves to IPv6 first and times out
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:${KAFKA_PORT},EXTERNAL_SAME_HOST://127.0.0.1:${KAFKA_SAME_HOST_PORT},EXTERNAL_DIFFERENT_HOST://${KAFKA_HOST_IP}:${KAFKA_OTHER_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL_SAME_HOST:PLAINTEXT,EXTERNAL_DIFFERENT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - ./Kafka/kafka-storage/kafka/data:/var/lib/kafka/data
      - ./Kafka/kafka-storage/kafka/secrets:/etc/kafka/secrets
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:${KAFKA_PORT}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFDROP_PORT}:${KAFDROP_PORT}"
    environment:
      SERVER_PORT: ${KAFDROP_PORT}
      KAFKA_BROKERCONNECT: kafka:${KAFKA_PORT}

  rest:
    build: { context: ., dockerfile: rest_service/Dockerfile }
    image: wine-rest:1.0.0
    container_name: wine-rest
    ports:
      - "${REST_PORT}:${REST_PORT}"
    environment:
      MODEL_PATH: /models/wine-model.joblib
      REST_PORT: ${REST_PORT}
    volumes:
      - ./model:/models:ro

  grpc:
    build: { context: ., dockerfile: grpc_service/Dockerfile }
    image: wine-grpc:1.0.0
    container_name: wine-grpc
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
    environment:
      MODEL_PATH: /models/wine-model.joblib
      GRPC_PORT: ${GRPC_PORT}
    volumes:
      - ./model:/models:ro

  kafka-worker:
    build: { context: ., dockerfile: kafka_service/Dockerfile }
    image: wine-kafka-worker:1.0.0
    container_name: wine-kafka-worker
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MODEL_PATH: /models/wine-model.joblib
      KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_PORT}
      REQUESTS_TOPIC: ${REQUESTS_TOPIC}
      PREDICTIONS_TOPIC: ${PREDICTIONS_TOPIC}
      CONSUMER_GROUP: ${CONSUMER_GROUP}
    volumes:
      - ./model:/models:ro
