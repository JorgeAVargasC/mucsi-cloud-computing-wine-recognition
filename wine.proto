syntax = "proto3";

package wine;

// The 13 measurements of a wine sample
message WineFeatures {
  double alcohol              = 1;
  double malic_acid           = 2;
  double ash                  = 3;
  double alcalinity_of_ash    = 4;
  double magnesium            = 5;
  double total_phenols        = 6;
  double flavanoids           = 7;
  double nonflavanoid_phenols = 8;
  double proanthocyanins      = 9;
  double color_intensity      = 10;
  double hue                  = 11;
  double od280_od315          = 12;
  double proline              = 13;
}

// Predicted wine class (1, 2 or 3)
message Prediction {
  int32 label = 1;
}

service WinePredictor {
  // Unary call: one request, one response
  rpc Predict (WineFeatures) returns (Prediction);
}
